name: Release tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Determine la version a taguer
        id: version
        run: echo "version=$(node scripts/extract-latest-version.cjs)" >> "$GITHUB_OUTPUT"

      - name: Cree et pousse le tag (le push d'un tag n'est pas bloque par la protection de la branche main)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Le tag v$VERSION existe deja, rien a faire."
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Installe les dependances
        run: |
          npm ci --prefix backend --ignore-scripts
          npm ci --prefix frontend --ignore-scripts

      - name: Build
        run: |
          npm run build --prefix backend
          npm run build --prefix frontend

      - name: Empaquette les builds
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          tar -czf "release/lootopia-backend-v$VERSION.tar.gz" -C backend dist
          tar -czf "release/lootopia-frontend-v$VERSION.tar.gz" -C frontend dist

      - name: créer la GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          artifacts: "release/*.tar.gz"
          allowUpdates: true
          body: |
            Voir le [CHANGELOG](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/CHANGELOG.md) pour les détails.

      