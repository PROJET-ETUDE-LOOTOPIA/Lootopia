name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installe les dependances racine
        run: npm ci

      - name: Installe les dependances backend
        run: npm ci --prefix backend

      - name: Installe les dependances frontend
        run: npm ci --prefix frontend

      - name: Verifie le lint
        run: npm run lint

      - name: Verifie le formatage
        run: npm run format:check

      - name: Execute les tests backend
        run: npm test --prefix backend

      - name: Execute les tests frontend
        run: npm test --prefix frontend
