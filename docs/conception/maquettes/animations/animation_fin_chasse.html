*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{margin:0;background:#0A3835;font-family:DM,sans-serif;color:#fff;overflow:hidden}
.stage{position:fixed;inset:0;background:#0A3835;overflow:hidden}
.scene{position:absolute;left:50%;top:50%;width:390px;height:844px;transform-origin:center center}
.rings{position:absolute;left:0;top:0;overflow:visible}
.flash{position:absolute;left:50%;top:330px;width:700px;height:700px;margin:-350px 0 0 -350px;border-radius:50%;background:radial-gradient(circle,rgba(252,239,210,.85) 0,rgba(240,168,46,.35) 35%,rgba(240,168,46,0) 68%);opacity:0;pointer-events:none}
.top{position:absolute;top:70px;left:0;right:0;text-align:center;opacity:0}
.top small{display:block;font:600 13px DM;letter-spacing:.08em;text-transform:uppercase;color:#7FB8B0}
.top h2{font:800 30px/1.1 Bricolage;margin-top:6px;letter-spacing:-.01em}
.chestwrap{position:absolute;left:40px;top:205px;width:280px;height:247px}
.chestwrap svg{width:280px;height:247px;overflow:visible;display:block}
.fx{position:absolute;left:140px;top:129px;width:0;height:0;pointer-events:none}
.fx i{position:absolute;display:block;will-change:transform,opacity}
.coin{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FCEFD2,#F0A82E 55%,#B8780F);border:2px solid #B8780F}
.conf{width:9px;height:14px;margin:-7px 0 0 -4px;border-radius:2px}
.score{position:absolute;top:490px;left:0;right:0;text-align:center}
.score .lbl{font:600 15px DM;color:#BFDDD8;opacity:0}
.score .num{font:800 72px/1 Bricolage;color:#F0A82E;margin-top:6px;letter-spacing:-.02em;opacity:0;transform-origin:center}
.score .pts{font:700 18px DM;color:#F7CE7E;margin-top:4px;opacity:0}
.stats{position:absolute;left:24px;right:24px;top:662px;display:flex;gap:10px}
.stat{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 10px;text-align:center;opacity:0}
.stat b{display:block;font:700 18px Bricolage}
.stat span{font:400 12px DM;color:#BFDDD8}
.cta{position:absolute;left:24px;right:24px;top:742px;opacity:0}
.btn{height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:600 15px DM}
.p{background:#F0A82E;color:#14231F}
.replay{margin-top:18px;border:0;background:#0E4A47;color:#fff;font:600 14px DM;padding:12px 22px;border-radius:999px;cursor:pointer}
.hint{font:400 12px DM;color:#56635E;margin-top:8px}
/* ---- chest parts ---- */
#drop,#shake,#lid,#glow,#coinsg,#raysg,.spark,#shadow{transform-box:view-box}
#drop{opacity:0}
.play #drop{animation:drop .95s both}
@keyframes drop{0%{transform:translateY(-330px);opacity:0}8%{opacity:1}55%{transform:translateY(0);opacity:1}70%{transform:translateY(-28px);opacity:1}85%{transform:translateY(0);opacity:1}92%{transform:translateY(-9px);opacity:1}100%{transform:translateY(0);opacity:1}}
#drop{transform-origin:130px 200px}
#shake{transform-origin:130px 200px}
.play #shake{animation:shake .6s 1.05s both}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-3.5deg) scale(1.02)}35%{transform:rotate(3.5deg) scale(1.02)}55%{transform:rotate(-3deg) scale(1.03)}75%{transform:rotate(2.5deg) scale(1.03)}90%{transform:rotate(0) scale(1.04)}}
#shadow{transform-origin:130px 207px;opacity:0}
.play #shadow{animation:sh .95s both}
@keyframes sh{0%{transform:scale(.2);opacity:0}55%{transform:scale(1);opacity:.45}70%{transform:scale(.8);opacity:.3}85%{transform:scale(1);opacity:.45}100%{transform:scale(1);opacity:.45}}
#lid{transform-origin:220px 120px}
.play #lid{animation:lid .8s 1.75s cubic-bezier(.3,1.5,.55,1) both}
@keyframes lid{from{transform:rotate(0)}to{transform:rotate(104deg)}}
#glow{transform-origin:130px 120px;opacity:0;transform:scale(.1,.1)}
.play #glow{animation:glow .7s 1.8s ease-out both}
@keyframes glow{from{opacity:0;transform:scale(.1,.1)}to{opacity:1;transform:scale(1,1)}}
#coinsg{opacity:0;transform:translateY(16px)}
.play #coinsg{animation:coinsup .7s 1.85s ease-out both}
@keyframes coinsup{to{opacity:1;transform:translateY(0)}}
#raysa{opacity:0;transform-origin:130px 120px;transform:scale(.2)}
.play #raysa{animation:rays 1.4s 1.8s ease-out both}
@keyframes rays{0%{opacity:0;transform:scale(.2)}35%{opacity:.8;transform:scale(1)}100%{opacity:.3;transform:scale(1.1)}}
#raysg{transform-origin:130px 120px}
.play #raysg{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spark{opacity:0;transform:scale(0)}
.play .spark{animation:tw 1.6s var(--d) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.play .flash{animation:fl .8s 1.75s ease-out both}

<script>
(function(){
  var stage=document.getElementById('stage'), fx=document.getElementById('fx'), num=document.getElementById('num');
  var q=new URLSearchParams(location.search); var POINTS=parseInt(q.get('points')||'1240',10);
  var fmt=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')};
  var timers=[], raf=null;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function burst(){
    var colors=['#F0A82E','#F7CE7E','#FCEFD2','#BFDDD8','#7FB8B0'];
    for(var i=0;i<16;i++){
      var c=document.createElement('i'); c.className='coin'; fx.appendChild(c);
      var dx=rnd(-130,130), up=rnd(150,290), fall=rnd(60,140);
      c.animate([{transform:'translate(0,0) scale(.4)',opacity:1},
        {transform:'translate('+dx*.62+'px,'+(-up)+'px) scale(1) rotate(200deg)',opacity:1,offset:.45},
        {transform:'translate('+dx+'px,'+fall+'px) scale(.9) rotate(420deg)',opacity:0}],
        {duration:rnd(1400,2000),delay:rnd(0,260),easing:'cubic-bezier(.25,.6,.4,1)',fill:'both'});
    }
    for(var j=0;j<44;j++){
      var f=document.createElement('i'); f.className='conf'; f.style.background=colors[j%colors.length]; fx.appendChild(f);
      var dx2=rnd(-190,190), up2=rnd(120,340), fall2=rnd(120,300);
      f.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
        {transform:'translate('+dx2*.6+'px,'+(-up2)+'px) rotate('+rnd(-300,300)+'deg)',opacity:1,offset:.4},
        {transform:'translate('+dx2+'px,'+fall2+'px) rotate('+rnd(-700,700)+'deg)',opacity:0}],
        {duration:rnd(1800,2800),delay:rnd(0,300),easing:'cubic-bezier(.2,.7,.4,1)',fill:'both'});
    }
    timers.push(setTimeout(function(){fx.innerHTML=''},3600));
  }
  function count(dur){
    var t0=performance.now();
    (function step(t){
      var p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      num.textContent=fmt(Math.round(POINTS*e));
      if(p<1) raf=requestAnimationFrame(step);
    })(t0);
  }
  function play(){
    timers.forEach(clearTimeout); timers=[]; if(raf) cancelAnimationFrame(raf);
    fx.innerHTML=''; num.textContent='0';
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
    timers.push(setTimeout(burst,1750));
    timers.push(setTimeout(function(){count(1500)},2100));
  }
  if(reduce){ stage.classList.add('static'); num.textContent=fmt(POINTS); }
  else play();
  var scene=document.getElementById('scene');
  function fit(){var k=Math.min(innerWidth/390,innerHeight/844,1.5);scene.style.transform='translate(-50%,-50%) scale('+k+')'}
  fit(); addEventListener('resize',fit);
})();
</script>
