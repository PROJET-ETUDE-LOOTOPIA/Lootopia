*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{margin:0;background:#0A3835;font-family:DM,sans-serif;color:#fff;overflow:hidden}
.stage{position:fixed;inset:0;height:100dvh;background:#0A3835;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.6vh,16px);padding:calc(max(14px,env(safe-area-inset-top)) + 84px) 24px max(18px,env(safe-area-inset-bottom))}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:max(22px,env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;align-items:center}
.label{font:800 clamp(26px,3.6vh,30px)/1.1 Bricolage;letter-spacing:-.01em;color:#fff;text-align:center;opacity:0}
.label:after{content:'';display:block;width:44px;height:4px;border-radius:2px;background:#F0A82E;margin:10px auto 0}
.art{position:relative;flex:none;width:min(62vw,26vh,300px);aspect-ratio:1/1}
.art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.ring{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.play .ring{animation:draw 1.5s calc(.1s + var(--i)*.14s) cubic-bezier(.4,0,.2,1) both}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}8%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.glow{position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(252,239,210,.7) 0,rgba(240,168,46,.28) 38%,rgba(240,168,46,0) 70%);opacity:0;pointer-events:none}
.play .glow{animation:gl .9s 1.45s ease-out both}
@keyframes gl{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
#disc,#check,.rp,.spark{transform-box:view-box}
#disc{transform-origin:128px 128px;transform:scale(0);opacity:0}
.play #disc{animation:disc .6s .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes disc{0%{transform:scale(0);opacity:0}15%{opacity:1}100%{transform:scale(1);opacity:1}}
#check{stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.play #check{animation:chk .5s 1.2s cubic-bezier(.4,0,.2,1) both}
@keyframes chk{0%{stroke-dashoffset:1;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.rp{transform-origin:128px 128px;opacity:0}
.play .rp{animation:rp 1.1s var(--d) ease-out both}
@keyframes rp{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
.spark{opacity:0;transform:scale(0)}
.play .spark{animation:tw 1.6s var(--d) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.fx{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.fx i{position:absolute;display:block;will-change:transform,opacity}
.coin{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FCEFD2,#F0A82E 55%,#B8780F);border:2px solid #B8780F}
.conf{width:8px;height:12px;margin:-6px 0 0 -4px;border-radius:2px}
.content{position:relative;z-index:2;width:100%;max-width:440px;text-align:center;flex:none}
.pts{opacity:0}
.pts .n{font:800 clamp(52px,8vh,64px)/1 Bricolage;color:#F0A82E;letter-spacing:-.02em}
.pts .u{font:700 16px DM;color:#F7CE7E;margin-top:4px}
.time{margin:clamp(12px,2.6vh,22px) auto 0;display:inline-flex;align-items:center;gap:12px;padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);opacity:0;text-align:left}
.time svg{flex:none}
.time b{display:block;font:700 20px Bricolage}
.time span{font:400 12px DM;color:#BFDDD8}
.trail{display:flex;align-items:center;justify-content:center;margin-top:clamp(12px,2.6vh,22px);opacity:0}
.nd{width:22px;height:22px;border-radius:50%;border:2px solid #2B7A74;display:flex;align-items:center;justify-content:center;flex:none;background:transparent;transition:none}
.nd svg{display:none}
.nd.done{background:#F0A82E;border-color:#F0A82E}.nd.done svg,.nd.jd svg{display:block}
.nd.jd{border-color:#F0A82E}
.play .nd.jd{animation:jd .5s 3.0s cubic-bezier(.3,1.6,.5,1) both}
@keyframes jd{0%{background:transparent;transform:scale(1)}50%{transform:scale(1.3)}100%{background:#F0A82E;transform:scale(1)}}
.nd.jd svg{opacity:0}.play .nd.jd svg{animation:fadein .2s 3.15s both}
@keyframes fadein{to{opacity:1}}
.nd.nx{border-color:#F7CE7E}
.play .nd.nx{animation:nx 1.8s 3.5s ease-in-out infinite}
@keyframes nx{0%,100%{box-shadow:0 0 0 0 rgba(247,206,126,.55)}60%{box-shadow:0 0 0 9px rgba(247,206,126,0)}}
.cn{width:30px;height:3px;background:#2B7A74;border-radius:2px;flex:none;position:relative;overflow:hidden}
.cn.done{background:#F0A82E}
.cn.fl:after{content:'';position:absolute;inset:0;background:#F0A82E;transform:scaleX(0);transform-origin:left}
.play .cn.fl:after{animation:flw .5s 3.2s ease-out both}
@keyframes flw{to{transform:scaleX(1)}}
.trailtxt{font:400 13px DM;color:#7FB8B0;margin-top:8px}
.cta{margin-top:clamp(16px,3.4vh,28px);display:flex;flex-direction:column;gap:10px;opacity:0}
.btn{height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 16px DM;background:#F0A82E;color:#14231F;cursor:pointer;border:0;width:100%;transition:transform .15s,background .15s}
.btn:hover{background:#F7B94A}.btn:active{transform:scale(.97)}
.btn2{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px DM;background:transparent;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.3);width:100%;transition:transform .15s,background .15s}
.btn2:hover{background:rgba(255,255,255,.1)}.btn2:active{transform:scale(.97)}
.play .label{animation:fade .7s .25s both}
.play .pts{animation:pop .7s 1.75s cubic-bezier(.3,1.4,.5,1) both}
.play .time{animation:fade .6s 2.5s both}
.play .trail{animation:fade .6s 2.8s both}
.play .cta{animation:fade .6s 3.4s both}
.play .btn{animation:pulse 2.4s 4.3s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(16px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,168,46,.55)}60%{box-shadow:0 0 0 14px rgba(240,168,46,0)}}
@media (max-height:720px) and (max-aspect-ratio:1/1){.trail,.trailtxt{display:none}}
@media (min-aspect-ratio:1/1) and (min-width:760px) and (min-height:520px){
  .stage{flex-direction:row;gap:clamp(40px,7vw,120px);padding:110px 6vw 40px}
  .art{width:min(36vw,66vh,540px)}
  .label{font-size:clamp(32px,4.6vh,42px)}
  .top{padding:34px 32px 0}
  .content{width:auto;min-width:340px;max-width:480px;text-align:left}
  .time{margin-left:0}.trail{justify-content:flex-start}
  .pts .n{font-size:clamp(64px,10vh,92px)}
  .btn{height:58px}
}
@media (min-aspect-ratio:1/1) and (max-width:759px), (min-aspect-ratio:1/1) and (max-height:519px){
  .stage{flex-direction:row;gap:24px;padding:64px 24px 12px}
  .art{width:min(32vw,64vh)}
  .top{padding:12px 16px 0}
  .label{font-size:22px}.label:after{display:none}
  .content{width:auto;max-width:360px;text-align:left}
  .pts .n{font-size:44px}.pts .u{font-size:14px}
  .time{margin-left:0;margin-top:8px;padding:6px 12px}.time b{font-size:17px}
  .trail,.trailtxt{display:none}
  .cta{margin-top:10px;gap:8px}.btn{height:44px;font-size:15px}.btn2{height:40px;font-size:14px}
}
.static .ring,.static #disc,.static #check,.static .label,.static .pts,.static .time,.static .trail,.static .cta,.static .nd,.static .cn:after{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}
.static .nd.jd{background:#F0A82E}.static .nd.jd svg{opacity:1}.static .cn.fl:after{transform:scaleX(1)}
.static .rp,.static .glow{display:none}
</style></head>

<script>
(function(){
  var stage=document.getElementById('stage'), art=document.getElementById('art'), fx=document.getElementById('fx'), ptsEl=document.getElementById('pts');
  var q=new URLSearchParams(location.search);
  var etape=Math.max(1,parseInt(q.get('etape')||'2',10)), total=Math.max(etape,parseInt(q.get('total')||'5',10));
  var POINTS=parseInt(q.get('points')||'120',10), TEMPS=q.get('temps')||'03:42';
  var last=etape>=total;
  // Titre : ?label= remplace tout le texte, ?titre= reçoit le nom de l'étape (steps.title en base).
  // Sans paramètre, le texte écrit dans l'HTML est conservé.
  if(q.get('label')) document.getElementById('label').textContent=q.get('label');
  else if(q.get('titre')) document.getElementById('label').textContent=q.get('titre')+' terminée';
  document.getElementById('time').textContent=TEMPS;
  if(last){ document.getElementById('next').firstChild.textContent='Terminer la chasse'; }
  var fmt=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
  // fil de progression
  var CHK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0A3835" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  var tr=document.getElementById('trail'), h='';
  for(var i=1;i<=total;i++){
    var cls=i<etape?'done':(i===etape?'jd':(i===etape+1?'nx':''));
    h+='<div class="nd '+cls+'">'+CHK+'</div>';
    if(i<total) h+='<div class="cn '+(i<etape?'done':(i===etape?'fl':''))+'"></div>';
  }
  tr.innerHTML=h;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers=[], raf=null;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function burst(){
    var k=art.offsetWidth/300, cols=['#F0A82E','#F7CE7E','#FCEFD2','#BFDDD8','#7FB8B0'];
    for(var i=0;i<12;i++){
      var c=document.createElement('i'); c.className='coin'; fx.appendChild(c);
      var dx=rnd(-120,120)*k, up=rnd(90,190)*k, fall=rnd(40,110)*k;
      c.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:'translate('+dx*.62+'px,'+(-up)+'px) scale(1) rotate(200deg)',opacity:1,offset:.45},{transform:'translate('+dx+'px,'+fall+'px) scale(.9) rotate(420deg)',opacity:0}],
        {duration:rnd(1100,1700),delay:rnd(0,200),easing:'cubic-bezier(.25,.6,.4,1)',fill:'both'});
    }
    for(var j=0;j<26;j++){
      var f=document.createElement('i'); f.className='conf'; f.style.background=cols[j%cols.length]; fx.appendChild(f);
      var dx2=rnd(-170,170)*k, up2=rnd(80,230)*k, fall2=rnd(80,200)*k;
      f.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx2*.6+'px,'+(-up2)+'px) rotate('+rnd(-300,300)+'deg)',opacity:1,offset:.4},{transform:'translate('+dx2+'px,'+fall2+'px) rotate('+rnd(-700,700)+'deg)',opacity:0}],
        {duration:rnd(1500,2300),delay:rnd(0,250),easing:'cubic-bezier(.2,.7,.4,1)',fill:'both'});
    }
    timers.push(setTimeout(function(){fx.innerHTML=''},3000));
  }
  function count(dur){
    var t0=performance.now();
    (function step(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);ptsEl.textContent='+'+fmt(Math.round(POINTS*e));if(p<1)raf=requestAnimationFrame(step)})(t0);
  }
  if(reduce){ stage.classList.add('static'); ptsEl.textContent='+'+fmt(POINTS); }
  else { stage.classList.add('play'); timers.push(setTimeout(burst,1550)); timers.push(setTimeout(function(){count(1000)},1850)); }
  function emit(name){
    window.dispatchEvent(new CustomEvent(name));
    if(window.parent!==window){ window.parent.postMessage({type:name},'*'); }
  }
  document.getElementById('next').addEventListener('click',function(){ emit(last?'lootopia:finish-hunt':'lootopia:next-step'); if(q.get('suite')) location.href=q.get('suite'); });
  document.getElementById('menu').addEventListener('click',function(){ emit('lootopia:back-to-menu'); if(q.get('menu')) location.href=q.get('menu'); });
})();
